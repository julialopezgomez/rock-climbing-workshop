[project]
name = "rcr"
version = "0.1.0"
description = "Rock Climbing Robots hackathon: team pipeline skeleton"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy"]

[dependency-groups]
# Filled in when the module that needs them gets a v0.
sim = ["mujoco>=3.16.0", "opencv-python>=5.0.0.93"]  # opencv: wall texture + ArUco plates
perception = [] # e.g. opencv (ArUco)
dev = ["pytest", "ruff"]
optimiser = [
    "casadi>=3.8.1",
    "coacd>=1.0.14",
    "coal>=3.0.3",
    "pin>=4.1.0",
]  # pin: only to check our CasADi kinematics in tests

[build-system]
requires = ["uv_build>=0.12.17,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
