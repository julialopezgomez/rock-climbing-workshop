[project]
name = "rcr"
version = "0.1.0"
description = "Rock Climbing Robots hackathon: team pipeline skeleton"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy"]

[dependency-groups]
# Filled in when the module that needs them gets a v0.
sim = []        # e.g. mujoco, better-actuator-models (Microban's servo model)
perception = [] # e.g. opencv (ArUco)
dev = ["pytest", "ruff"]

[build-system]
requires = ["uv_build>=0.12.17,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
