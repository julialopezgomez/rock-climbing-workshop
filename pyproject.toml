[project]
name = "rcr"
version = "0.1.0"
description = "Rock Climbing Robots hackathon: team pipeline skeleton"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy>=1.18.1",
]

[dependency-groups]
# Filled in when the module that needs them gets a v0.
# microban-model: the robot (Rhoban/microban_model, its URDF and MJCF, meshes in Git LFS), what
# Microban dev_v2 and the organisers' simulator use; pinned below to the same commit [Microban]
sim = ["mujoco>=3.16.0", "opencv-python>=5.0.0.93", "microban-model"]  # opencv: wall texture + ArUco
perception = [] # e.g. opencv (ArUco)
dev = ["pytest", "ruff"]
optimiser = [
    "microban-model",
    "casadi>=3.8.1",
    "coacd>=1.0.14",
    "coal>=3.0.3",
    "pin>=4.1.0",
]  # pin: only to check our CasADi kinematics in tests

[build-system]
requires = ["uv_build>=0.12.17,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["third_party"]  # Microban, the submodule: not our code

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
# the organisers' simulator's commit (third_party/simulator/uv.lock); needs git-lfs installed
microban-model = { git = "https://github.com/Rhoban/microban_model", rev = "8e42ef70673b5747dbdca3efaf60bc0f8ec7ea6d", lfs = true }
