[project]
name = "rcr"
version = "0.1.0"
description = "Rock Climbing Robots hackathon: team pipeline skeleton"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    # the planner's reach and IK (rcr.planner.astar): Pinocchio on the robot's URDF, from
    # microban-model (pinned below: our fork of the simulator's commit, feet cut) [Microban, Ours]
    "pin>=4.1.0",
    "microban-model",
    # the organisers' simulator (third_party/simulator): walls, and the MuJoCo viewer of a plan
    "climbing-sim",
]

[dependency-groups]
# Filled in when the module that needs them gets a v0.
# microban-model: the robot (Rhoban/microban_model, its URDF and MJCF, meshes in Git LFS), what
# Microban dev_v2 and the organisers' simulator use; pinned below to our fork of the same commit,
# where only the climbing feet are cut as on our robot [Microban, Ours]
# sim: the organisers' simulator (third_party/simulator, climbing_sim), with Rhoban's robot sim
sim = ["climbing-sim", "microban-model"]
perception = [] # e.g. opencv (ArUco)
dev = ["pytest", "ruff"]
optimiser = [
    "microban-model",
    "climbing-sim",  # the hold mesh and its placement, from the organisers' simulator
    "casadi>=3.8.1",
    "coacd>=1.0.14",
    "coal>=3.0.3",
    "pin>=4.1.0",
]  # pin: only to check our CasADi kinematics in tests

[build-system]
requires = ["uv_build>=0.12.17,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
# not our code: the submodules (Microban, the simulator) and the ARO course's IK reference
extend-exclude = ["third_party", "src/rcr/planner/inverse_kin_aro_reference.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# The organisers' simulator asks for Rhoban's microban-model; ours (the fork, in the sources below)
# replaces it for every package, so their sim loads the same robot as the optimiser [Ours]
override-dependencies = ["microban-model"]

[tool.uv.sources]
# the organisers' simulator, the submodule as it is (never edited); its dependencies pinned to
# the commits of its uv.lock. microban-model needs git-lfs installed
climbing-sim = { path = "third_party/simulator" }
microban-sim = { git = "https://github.com/Rhoban/microban_sim", rev = "29234e369e33411ff42276096c6c6af208ad3b65" }
# our fork (branch cut-foot): Rhoban's 8e42ef7 with the climbing feet cut, nothing else changed
microban-model = { git = "https://github.com/MohammadrezaDindarloo/microban_model", rev = "4e8a1f0929f42742e705bcf51e7f93feaa99eca6", lfs = true }
